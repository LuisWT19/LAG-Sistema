services:
  mysql:
    image: mysql:8.4
    container_name: lag-mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lag_system
      MYSQL_USER: lag_user
      MYSQL_PASSWORD: lag_password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: